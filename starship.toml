"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# Available palettes (set 'palette' below):
#  catppuccin  catppuccin_latte  tokyo_night  gruvbox  dracula  nord  one_dark  solarized_dark  monochrome
#  cyberpunk  ember  ice  orchid  aurora  forest  obsidian  harbor  neon_noir  paper  slate  umber
#  jewel  velvet  abyss  cellar

palette = 'catppuccin'

format = """
[](identity)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_metrics\
$git_status\
$git_state\
$c\
$cmake\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$dart\
$haskell\
$swift\
$dotnet\
$python\
$conda\
$nix_shell\
$docker_context\
$kubernetes\
$container\
$netns\
$cmd_duration\
[](fg:prev_bg)\
$fill\
[](fg:bar)\
$battery\
$time\
[](fg:bar)\
$line_break\
$character"""

[os]
disabled = false
style = 'bg:identity fg:ink'
format = '[$symbol ]($style)'

[username]
disabled = false
show_always = false
style_user = 'bg:identity fg:ink'
style_root = 'bg:identity fg:ink'
format = '[($user)]($style)'

[hostname]
disabled = false
ssh_only = true
ssh_symbol = '  '
style = 'bg:identity fg:ink'
format = '[$ssh_symbol$hostname ]($style)'

[directory]
style = 'bg:path fg:ink'
truncation_length = 7
truncation_symbol = '…/'
truncate_to_repo = false
read_only_style = 'bg:path fg:crit'
read_only = ''
format = '[](fg:prev_bg bg:path)[ $path ]($style)[($read_only )]($read_only_style)'

#[directory.substitutions]
#'Desktop' = ' '
#'Documents' = '󰈙 '
#'Downloads' = ' '
#'Music' = '󰝚 '
#'Pictures' = ' '
#'Developer' = '󰲋 '

[git_branch]
symbol = ''
style = 'bg:vcs fg:ink'
format = '[](fg:prev_bg bg:vcs)[ $symbol $branch ]($style)'

[git_status]
disabled = false
style = 'bg:vcs fg:ink'
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇡${ahead_count}⇣${behind_count} '
staged = '+${count} '
modified = '!${count} '
untracked = '?${count} '
deleted = '✘${count} '
renamed = '»${count} '
stashed = '≡${count} '
conflicted = '[‼${count} ](bg:vcs fg:crit)'
format = '[($all_status$ahead_behind)]($style)'

[git_metrics]
disabled = true
only_nonzero_diffs = true
added_style = 'bg:vcs fg:ink'
deleted_style = 'bg:vcs fg:ink'
format = '([+$added ]($added_style))([-$deleted ]($deleted_style))'

[git_state]
style = 'bg:vcs fg:ink'
format = '[$state( $progress_current/$progress_total) ]($style)'

[c]
symbol = ''
style = 'bg:lang_c fg:ink'
version_format = 'v${major}(.${minor})'
format = '[](fg:prev_bg bg:lang_c)[ $symbol( ${version}) ]($style)'

[cmake]
symbol = ''
style = 'bg:lang_cmake fg:ink'
version_format = 'v${major}(.${minor})'
format = '[](fg:prev_bg bg:lang_cmake)[ $symbol( ${version}) ]($style)'

[rust]
symbol = ''
style = 'bg:lang_rust fg:ink'
version_format = 'v${major}(.${minor})'
format = '[](fg:prev_bg bg:lang_rust)[ $symbol( ${version}) ]($style)'

[golang]
symbol = ''
style = 'bg:lang_golang fg:ink'
version_format = 'v${major}(.${minor})'
format = '[](fg:prev_bg bg:lang_golang)[ $symbol( ${version}) ]($style)'

[nodejs]
symbol = ''
style = 'bg:lang_nodejs fg:ink'
version_format = 'v${major}(.${minor})'
format = '[](fg:prev_bg bg:lang_nodejs)[ $symbol( ${version}) ]($style)'

[bun]
symbol = ''
style = 'bg:lang_bun fg:ink'
version_format = 'v${major}(.${minor})'
format = '[](fg:prev_bg bg:lang_bun)[ $symbol( ${version}) ]($style)'

[php]
symbol = ''
style = 'bg:lang_php fg:ink'
version_format = 'v${major}(.${minor})'
format = '[](fg:prev_bg bg:lang_php)[ $symbol( ${version}) ]($style)'

[java]
symbol = ''
style = 'bg:lang_java fg:ink'
version_format = 'v${major}(.${minor})'
format = '[](fg:prev_bg bg:lang_java)[ $symbol( ${version}) ]($style)'

[kotlin]
symbol = ''
style = 'bg:lang_kotlin fg:ink'
version_format = 'v${major}(.${minor})'
format = '[](fg:prev_bg bg:lang_kotlin)[ $symbol( ${version}) ]($style)'

[dart]
symbol = ''
style = 'bg:lang_dart fg:ink'
version_format = 'v${major}(.${minor})'
format = '[](fg:prev_bg bg:lang_dart)[ $symbol( ${version}) ]($style)'

[haskell]
symbol = ''
style = 'bg:lang_haskell fg:ink'
version_format = 'v${major}(.${minor})'
format = '[](fg:prev_bg bg:lang_haskell)[ $symbol( ${version}) ]($style)'

[swift]
symbol = ''
style = 'bg:lang_swift fg:ink'
version_format = 'v${major}(.${minor})'
format = '[](fg:prev_bg bg:lang_swift)[ $symbol( ${version}) ]($style)'

[dotnet]
symbol = '󰪮'
style = 'bg:lang_dotnet fg:ink'
version_format = 'v${major}(.${minor})'
format = '[](fg:prev_bg bg:lang_dotnet)[ $symbol( ${version}) ]($style)'

[python]
symbol = ''
style = 'bg:lang_python fg:ink'
version_format = 'v${major}(.${minor})'
format = '[](fg:prev_bg bg:lang_python)[ $symbol( ${pyenv_prefix})( ${version})( \($virtualenv\)) ]($style)'

[conda]
symbol = ''
style = 'bg:env fg:ink'
format = '[](fg:prev_bg bg:env)[ $symbol $environment ]($style)'

[nix_shell]
disabled = false
symbol = '󱄅'
style = 'bg:env fg:ink'
format = '[](fg:prev_bg bg:env)[ $symbol $state( \($name\)) ]($style)'

[docker_context]
disabled = false
symbol = ''
style = 'bg:container fg:ink'
format = '[](fg:prev_bg bg:container)[ $symbol( $context) ]($style)'

[kubernetes]
disabled = false
symbol = '󱃾'
style = 'bg:cluster fg:ink'
format = '[](fg:prev_bg bg:cluster)[ $symbol $context( \($namespace\)) ]($style)'

[container]
disabled = false
symbol = ''
style = 'bg:container fg:ink'
format = '[](fg:prev_bg bg:container)[ $symbol $name ]($style)'

[netns]
disabled = false
symbol = ''
style = 'bg:net fg:ink'
format = '[](fg:prev_bg bg:net)[$symbol \[$name\]]($style)'

[cmd_duration]
disabled = false
min_time = 2000
style = 'bg:dur fg:ink'
format = '[](fg:prev_bg bg:dur)[ 󱎫 $duration]($style)'

[fill]
disabled = false
symbol = ' ∙'
style = 'fg:fill_ink'

[battery]
disabled = false
full_symbol = '󰁹'
charging_symbol = '󰂄'
discharging_symbol = '󰂃'
unknown_symbol = '󰂑'
empty_symbol = '󰂎'
format = '[$symbol($percentage) ]($style)'

[[battery.display]]
threshold = 20
style = 'bg:bar fg:bat_crit'

[[battery.display]]
threshold = 50
style = 'bg:bar fg:bat_low'

[[battery.display]]
threshold = 100
style = 'bg:bar fg:bar_ink'

[time]
disabled = false
time_format = '%R'
style = 'bg:bar fg:bar_ink'
format = '[ $time]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:ok)'
error_symbol = '[❯](bold fg:err)'
vimcmd_symbol = '[❮](bold fg:ok)'
vimcmd_replace_one_symbol = '[❮](bold fg:err)'
vimcmd_replace_symbol = '[❮](bold fg:err)'
vimcmd_visual_symbol = '[❮](bold fg:vim)'

[os.symbols]
Windows = ''
Ubuntu = '󰕈'
SUSE = ''
Raspbian = '󰐿'
Mint = '󰣭'
Macos = ''
Manjaro = ''
Linux = '󰌽'
Gentoo = '󰣨'
Fedora = '󰣛'
Alpine = ''
Amazon = ''
Android = ''
Arch = '󰣇'
Artix = '󰣇'
CentOS = ''
Debian = '󰣚'
Redhat = '󱄛'
RedHatEnterprise = '󱄛'

