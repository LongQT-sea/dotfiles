"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

palette = 'catppuccin_mocha'

format = """
[](red)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_metrics\
$git_status\
$git_state\
$nix_shell\
$docker_context\
$kubernetes\
$container\
$netns\
$c\
$cmake\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$dart\
$haskell\
$swift\
$dotnet\
$python\
$conda\
$cmd_duration\
[](fg:prev_bg)\
$fill\
[](fg:surface0)\
$battery\
$time\
[](fg:surface0)\
$line_break\
$character"""

[os]
disabled = false
style = 'bg:red fg:crust'
format = '[$symbol ]($style)'

[username]
disabled = false
show_always = false
style_user = 'bg:red fg:crust'
style_root = 'bg:red fg:crust'
format = '[($user)]($style)'

[hostname]
disabled = false
ssh_only = true
ssh_symbol = '󰖟'
style = 'bg:red fg:crust'
format = '[@$hostname]($style)'

[directory]
style = 'bg:peach fg:crust'
format = '[](fg:prev_bg bg:peach)[ $path ]($style)[($read_only )]($read_only_style)'
truncation_length = 4
truncation_symbol = '…/'
truncate_to_repo = true
read_only_style = 'bg:peach fg:crust'
read_only = ''

#[directory.substitutions]
#'Documents' = '󰈙 '
#'Downloads' = ' '
#'Music' = '󰝚 '
#'Pictures' = ' '
#'Developer' = '󰲋 '

[os.symbols]
Windows = ''
Ubuntu = '󰕈'
SUSE = ''
Raspbian = '󰐿'
Mint = '󰣭'
Macos = ''
Manjaro = ''
Linux = '󰌽'
Gentoo = '󰣨'
Fedora = '󰣛'
Alpine = ''
Amazon = ''
Android = ''
Arch = '󰣇'
Artix = '󰣇'
CentOS = ''
Debian = '󰣚'
Redhat = '󱄛'
RedHatEnterprise = '󱄛'

[git_branch]
symbol = ''
style = 'bg:yellow fg:crust'
format = '[](fg:prev_bg bg:yellow)[ $symbol $branch ]($style)'

[git_status]
style = 'bg:yellow fg:crust'
format = '[($all_status$ahead_behind)]($style)'
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇡${ahead_count}⇣${behind_count} '
staged = '+${count} '
modified = '!${count} '
untracked = '?${count} '
deleted = '✘${count} '
renamed = '»${count} '
stashed = '≡${count} '
conflicted = '‼${count} '

[git_metrics]
disabled = false
only_nonzero_diffs = true
added_style = 'bg:yellow fg:crust'
deleted_style = 'bg:yellow fg:crust'
format = '([+$added ]($added_style))([-$deleted ]($deleted_style))'

[git_state]
style = 'bg:yellow fg:crust'
format = '[$state( $progress_current/$progress_total) ]($style)'

[c]
symbol = ''
style = 'bg:green fg:crust'
format = '[](fg:prev_bg bg:green)[ $symbol( ${version}) ]($style)'

[cmake]
symbol = ''
style = 'bg:green fg:crust'
format = '[](fg:prev_bg bg:green)[ $symbol( ${version}) ]($style)'

[rust]
symbol = ''
style = 'bg:green fg:crust'
format = '[](fg:prev_bg bg:green)[ $symbol( ${version}) ]($style)'

[golang]
symbol = ''
style = 'bg:green fg:crust'
format = '[](fg:prev_bg bg:green)[ $symbol( ${version}) ]($style)'

[nodejs]
symbol = ''
style = 'bg:green fg:crust'
format = '[](fg:prev_bg bg:green)[ $symbol( ${version}) ]($style)'

[bun]
symbol = ''
style = 'bg:green fg:crust'
format = '[](fg:prev_bg bg:green)[ $symbol( ${version}) ]($style)'

[php]
symbol = ''
style = 'bg:green fg:crust'
format = '[](fg:prev_bg bg:green)[ $symbol( ${version}) ]($style)'

[java]
symbol = ''
style = 'bg:green fg:crust'
format = '[](fg:prev_bg bg:green)[ $symbol( ${version}) ]($style)'

[kotlin]
symbol = ''
style = 'bg:green fg:crust'
format = '[](fg:prev_bg bg:green)[ $symbol( ${version}) ]($style)'

[dart]
symbol = ''
style = 'bg:green fg:crust'
format = '[](fg:prev_bg bg:green)[ $symbol( ${version}) ]($style)'

[haskell]
symbol = ''
style = 'bg:green fg:crust'
format = '[](fg:prev_bg bg:green)[ $symbol( ${version}) ]($style)'

[swift]
symbol = ''
style = 'bg:green fg:crust'
format = '[](fg:prev_bg bg:green)[ $symbol( ${version}) ]($style)'

[dotnet]
symbol = '󰪮'
style = 'bg:green fg:crust'
format = '[](fg:prev_bg bg:green)[ $symbol( ${version}) ]($style)'

[python]
symbol = ''
style = 'bg:green fg:crust'
format = '[](fg:prev_bg bg:green)[ $symbol( ${pyenv_prefix})( ${version})( \($virtualenv\)) ]($style)'

[conda]
symbol = ''
style = 'bg:sapphire fg:crust'
format = '[](fg:prev_bg bg:sapphire)[ $symbol $environment ]($style)'

[nix_shell]
disabled = false
symbol = '󱄅'
style = 'bg:sky fg:crust'
format = '[](fg:prev_bg bg:sky)[ $symbol $state( \($name\)) ]($style)'

[docker_context]
symbol = ''
style = 'bg:sapphire fg:crust'
format = '[](fg:prev_bg bg:sapphire)[ $symbol( $context) ]($style)'

[kubernetes]
disabled = false
symbol = '󱃾'
style = 'bg:blue fg:crust'
format = '[](fg:prev_bg bg:blue)[ $symbol $context( \($namespace\)) ]($style)'

[container]
disabled = false
symbol = ''
style = 'bg:mauve fg:crust'
format = '[](fg:prev_bg bg:mauve)[ $symbol $name ]($style)'

[netns]
disabled = false
symbol = ''
style = 'bg:teal fg:crust'
format = '[](fg:prev_bg bg:teal)[$symbol \[$name\]]($style)'

[cmd_duration]
min_time = 2000
style = 'bg:lavender fg:crust'
format = '[](fg:prev_bg bg:lavender)[ 󱎫 $duration]($style)'

[fill]
symbol = ' ∙'

[battery]
disabled = false
full_symbol = '󰁹'
charging_symbol = '󰂄'
discharging_symbol = '󰂃'
unknown_symbol = '󰂑'
empty_symbol = '󰂎'
format = '[](fg:prev_bg bg:red)[$symbol($percentage) ]($style)'

[[battery.display]]
threshold = 20
style = 'bg:surface0 fg:red'

[time]
disabled = false
time_format = '%R'
style = 'bg:surface0 fg:text'
format = '[ $time]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

